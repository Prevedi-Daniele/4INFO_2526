<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/prevedi_esercizio_js_pitagorica_in_classe.css">
    <script src="../scripts/prevedi_esercizio_js_pitagorica_in_classe.js"></script>
    <title>Tavola Pitagorica</title>
</head>

<body>
    <h1 class="main-title">Tavola Pitagorica</h1>

    <div class="input-top">
        <label for="colonne">Numero di colonne</label>
        <input type="number" id="colonne" min="3" max="12" />
        <button>Genera</button>
    </div>
    <table id="pitagorica">
        <tr>
            <td></td>
            <td class="header">1</td>
            <td class="header">2</td>
            <td class="header">3</td>
            <td class="header">4</td>
        </tr>
        <tr>
            <td class="header">1</td>
            <td class="divisore">1</td>
            <td class="divisore">2</td>
            <td>3</td>
            <td class="divisore">4</td>
        </tr>
        <tr>
            <td class="header">2</td>
            <td class="divisore">2</td>
            <td class="divisore">4</td>
            <td>6</td>
            <td>8</td>
        </tr>
        <tr>
            <td class="header">3</td>
            <td>3</td>
            <td>6</td>
            <td>9</td>
            <td>12</td>
        </tr>
        <tr>
            <td class="header">4</td>
            <td class="divisore">4</td>
            <td>8</td>
            <td>12</td>
            <td>16</td>
        </tr>
    </table>
    <div class="input-bottom">
        <label for="">Numero</label>
        <input type="" id="" min="3" max="12" />
        <button>Multipli</button>
        <button>Divisori</button>
    </div>
</body>

</html>
